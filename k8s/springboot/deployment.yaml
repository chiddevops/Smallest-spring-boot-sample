apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: springboot-app 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      app: springboot-app 
  template: 
    metadata: 
      labels: 
        app: springboot-app 
    spec: 
      containers: 
        - name: springboot-container 
          image: chidaa/harness-demo:V1.1
          ports: 
            - containerPort: 8080 
